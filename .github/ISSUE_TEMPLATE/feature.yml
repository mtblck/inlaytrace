name: Feature request
description: Something Inlay should do.
labels: [type:feature]
body:
  - type: markdown
    attributes:
      value: Check the [roadmap](https://github.com/mtblck/inlaytrace/blob/main/docs/roadmap.md) first; it may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The job, not the feature. "Cut each colour on a vinyl cutter" is more useful than "add a DXF button".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
