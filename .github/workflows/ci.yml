name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The PR merge commit and its base parent, for coverage of the changed lines.
          fetch-depth: 2
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `npm test`, also writing coverage/lcov.info
      - run: npm run coverage
      # vendor + hosting:check + tsc + vite build
      - run: npm run build
      # Report only: whole-repo and changed-line coverage in the job summary, plus
      # coverage/diff-coverage.json for the Claude review. Fails only below the
      # COVERAGE_MIN / DIFF_COVERAGE_MIN repository variables, when they are set.
      - name: Coverage report
        if: ${{ !cancelled() && hashFiles('coverage/lcov.info') != '' }}
        run: node .github/scripts/coverage-report.mjs
        env:
          COVERAGE_MIN: ${{ vars.COVERAGE_MIN }}
          DIFF_COVERAGE_MIN: ${{ vars.DIFF_COVERAGE_MIN }}
      - name: Upload coverage
        if: ${{ !cancelled() && hashFiles('coverage/lcov.info') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
            coverage/diff-coverage.json
          retention-days: 14
          if-no-files-found: ignore

  # The package as npm users get it: built, linted for publishing, and loaded
  # by plain Node on the oldest version it supports (engines: >=20) and the newest.
  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/inlay
      - run: npm run check -w packages/inlay
      - run: node packages/inlay/test/smoke.mjs
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 20
      - name: Smoke test on Node 20
        run: node --version && node packages/inlay/test/smoke.mjs

  e2e:
    name: E2E (real browser)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start preview
        run: |
          npm run preview -- --port 4173 > preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/app/ > /dev/null && exit 0
            sleep 1
          done
          cat preview.log
          exit 1
      - run: npm run verify
        env:
          SHOTS: shots
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-shots
          path: |
            shots
            preview.log
          if-no-files-found: ignore
