name: Docs drift check

# Once a month, checks README, CLAUDE.md, docs/ (including ADRs), .env.example, the
# changelog and the privacy page against the code on the default branch, and keeps
# one open issue listing the drift (opens it, updates it, or closes it when the docs
# are clean). It never edits docs or opens a PR: fixes happen when someone asks.
# The check is the maintenance plugin's docs-check skill from
# mtblck/claude-marketplace. Run it by hand from the Actions tab at any time.
# GitHub pauses scheduled workflows in public repos after 60 days without activity;
# re-enable it from the Actions tab if that happens.
on:
  schedule:
    - cron: "17 9 1 * *"
  workflow_dispatch:

concurrency:
  group: docs-drift-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Write is only for the one drift issue.
    permissions:
      contents: read
      issues: write
    env:
      # Skip, rather than fail, until the secret is added to the repo.
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; skipping docs drift check."
      # The default branch, so .claude/ and the docs are what's merged.
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - if: env.HAS_TOKEN == 'true'
        uses: anthropics/claude-code-action@e4a6faad497d33dbc7144135c75e41f82f0bf6c0 # v1, pinned: it runs with the token
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          plugin_marketplaces: https://github.com/mtblck/claude-marketplace.git
          plugins: maintenance@mtblck
          prompt: "/maintenance:docs-check --issue ${{ github.repository }}"
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Agent,Bash(gh api:*),Bash(git log:*),Bash(git show:*),Bash(git ls-files:*),Bash(git rev-parse:*)"
          # Without this the log only says "is_error: true" when Claude fails, never why.
          show_full_output: true
