name: Claude review

# Reviews a PR once it is ready for a human: when opened as non-draft, or when a
# draft is marked ready for review. Not on every push, to keep usage down.
# To review new pushes, run this workflow from the Actions tab with the PR number;
# it then reviews only what changed since the last review.
# The review is the pr-review plugin from mtblck/claude-marketplace, so a PR can't
# change how it is reviewed.
on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review
        required: true

concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    # Manual runs, or non-draft PRs from this repo (never forks). Dependabot PRs
    # get claude-dependabot.yml instead.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # To read CI's coverage and the perf workflow's artifacts.
      actions: read
      id-token: write
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr }}
      # Skip, rather than fail, until the secret is added to the repo.
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; skipping Claude review."
      # Default branch first, so .claude/ (settings, hooks) comes from main, not the PR.
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      # Then the PR's code, with full history for re-reviews and base-branch rules.
      - if: env.HAS_TOKEN == 'true'
        run: |
          git fetch --no-tags origin "+refs/pull/$PR/head:refs/remotes/pr/head"
          if [ -d .claude ]; then cp -r .claude "$RUNNER_TEMP/repo-claude"; fi
          git checkout --detach pr/head
          rm -rf .claude
          if [ -d "$RUNNER_TEMP/repo-claude" ]; then cp -r "$RUNNER_TEMP/repo-claude" .claude; fi
      # CI's coverage artifacts for the PR head, if CI makes them: waits up to 12 min
      # for the CI run, then hands the review --coverage. Nothing to wait for, no flag.
      - if: env.HAS_TOKEN == 'true'
        id: coverage
        # Coverage is extra evidence: if fetching it fails, review without it.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          rm -rf .claude-coverage
          [ -f .github/workflows/ci.yml ] && grep -q coverage-report .github/workflows/ci.yml || exit 0
          sha=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          for _ in $(seq 36); do
            run=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$sha&event=pull_request&per_page=1" \
              --jq '.workflow_runs[0] | select(.status == "completed") | .id')
            [ -n "$run" ] && break
            sleep 20
          done
          if [ -z "$run" ]; then echo "::notice::No finished CI run for $sha; reviewing without coverage."; exit 0; fi
          if gh run download "$run" -R "$REPO" -p 'coverage*' -D .claude-coverage; then
            echo "arg=--coverage .claude-coverage" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CI run $run has no coverage artifact; reviewing without coverage."
          fi
      # The perf workflow's numbers for this head, if the repo has perf.yml. Kept
      # outside the checkout so a PR can't commit its own. Waits up to 15 minutes
      # for the run (it builds twice), then reviews without them.
      - if: env.HAS_TOKEN == 'true'
        # Measurements are extra evidence: if fetching them fails, review without them.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/perf"
          [ -f .github/workflows/perf.yml ] || exit 0
          sha=$(git rev-parse HEAD)
          for i in $(seq 1 45); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/perf.yml/runs?head_sha=$sha&per_page=1" \
              --jq '.workflow_runs[0] // empty | "\(.id) \(.status)"' 2>/dev/null || true)
            if [ -z "$run" ] && [ "$i" -ge 6 ]; then
              echo "::notice::No perf run for $sha; reviewing without measurements."; exit 0
            fi
            if [ "${run#* }" = completed ]; then
              gh run download "${run%% *}" --name perf --dir "$RUNNER_TEMP/perf" ||
                echo "::notice::Perf run ${run%% *} left no artifact; reviewing without measurements."
              exit 0
            fi
            sleep 20
          done
          echo "::notice::Perf run still going after 15 minutes; reviewing without measurements."
      - if: env.HAS_TOKEN == 'true'
        uses: anthropics/claude-code-action@e4a6faad497d33dbc7144135c75e41f82f0bf6c0 # v1, pinned: it runs with the token
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/mtblck/claude-marketplace.git
          plugins: pr-review@mtblck
          prompt: "/pr-review:review --comment ${{ steps.coverage.outputs.arg }} --perf ${{ runner.temp }}/perf/summary.json ${{ github.repository }}/pull/${{ env.PR }}"
          claude_args: >-
            --add-dir ${{ runner.temp }}/perf
            --allowedTools "Read,Grep,Glob,Agent,Bash(gh api:*),Bash(git fetch:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git merge-base:*),Bash(git rev-parse:*),Bash(git cat-file:*),mcp__github_inline_comment__create_inline_comment"
          # Without this the log only says "is_error: true" when Claude fails, never why.
          show_full_output: true
