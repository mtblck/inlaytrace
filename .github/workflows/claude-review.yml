name: Claude review

# Reviews a PR once it is ready for a human: when opened as non-draft, or when a
# draft is marked ready for review. Not on every push, to keep usage down.
# To review new pushes, run this workflow from the Actions tab with the PR number;
# it then reviews only what changed since the last review.
# The review itself is .claude/skills/review/SKILL.md.
on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review
        required: true

concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    # PRs from forks never get the token anyway; this skips them outright, so a
    # stranger's PR can't spend review runs or put text in front of the reviewer.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr }}
      # Skip, rather than fail, until the secret is added to the repo.
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set; skipping Claude review."
      # The skill comes from the default branch, so a PR can't change its own review.
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      # Then the PR's code, with full history for re-reviews and base-branch rules.
      - if: env.HAS_TOKEN == 'true'
        run: |
          if [ ! -f .claude/skills/review/SKILL.md ]; then
            echo "::notice::No review skill on the default branch yet; skipping Claude review."
            echo "NO_SKILL=1" >> "$GITHUB_ENV"
            exit 0
          fi
          git fetch --no-tags origin "+refs/pull/$PR/head:refs/remotes/pr/head"
          cp -r .claude "$RUNNER_TEMP/claude-skills"
          git checkout --detach pr/head
          rm -rf .claude && cp -r "$RUNNER_TEMP/claude-skills" .claude
      - if: env.HAS_TOKEN == 'true' && env.NO_SKILL != '1'
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1, pinned: it runs with the token
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/review --comment ${{ github.repository }}/pull/${{ env.PR }}"
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Agent,Bash(gh api:*),Bash(git fetch:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git merge-base:*),Bash(git rev-parse:*),Bash(git cat-file:*),mcp__github_inline_comment__create_inline_comment"
          # Without this the log only says "is_error: true" when Claude fails, never why.
          show_full_output: true
