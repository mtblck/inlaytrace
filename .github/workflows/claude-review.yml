name: Claude review

# Reviews a PR once it is ready for a human: when opened as non-draft, or when a
# draft is marked ready for review. Not on every push, to keep usage down.
# To review new pushes, run this workflow from the Actions tab with the PR number;
# it then reviews only what changed since the last review.
# The review is the pr-review plugin from mtblck/claude-marketplace, so a PR can't
# change how it is reviewed.
on:
  pull_request:
    types: [opened, ready_for_review, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review
        required: true

concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    # Manual runs, or non-draft PRs from this repo (never forks).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr }}
      # Skip, rather than fail, until the secrets are added to the repo.
      HAS_SECRETS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && secrets.MARKETPLACE_TOKEN != '' }}
    steps:
      - if: env.HAS_SECRETS != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN or MARKETPLACE_TOKEN is not set; skipping Claude review."
      # Default branch first, so .claude/ (settings, hooks) comes from main, not the PR.
      - if: env.HAS_SECRETS == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      # Then the PR's code, with full history for re-reviews and base-branch rules.
      - if: env.HAS_SECRETS == 'true'
        run: |
          git fetch --no-tags origin "+refs/pull/$PR/head:refs/remotes/pr/head"
          if [ -d .claude ]; then cp -r .claude "$RUNNER_TEMP/repo-claude"; fi
          git checkout --detach pr/head
          rm -rf .claude
          if [ -d "$RUNNER_TEMP/repo-claude" ]; then cp -r "$RUNNER_TEMP/repo-claude" .claude; fi
      # The marketplace is private: check it out with a read-only token, without
      # leaving the token in git config, and hand the action a local path.
      - if: env.HAS_SECRETS == 'true'
        uses: actions/checkout@v7
        with:
          repository: mtblck/claude-marketplace
          token: ${{ secrets.MARKETPLACE_TOKEN }}
          path: .marketplace
          persist-credentials: false
      - if: env.HAS_SECRETS == 'true'
        run: mv .marketplace "$RUNNER_TEMP/claude-marketplace"
      - if: env.HAS_SECRETS == 'true'
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1, pinned: it runs with the token
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: ${{ runner.temp }}/claude-marketplace
          plugins: pr-review@mtblck
          prompt: "/pr-review:review --comment ${{ github.repository }}/pull/${{ env.PR }}"
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Agent,Bash(gh api:*),Bash(git fetch:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git merge-base:*),Bash(git rev-parse:*),Bash(git cat-file:*),mcp__github_inline_comment__create_inline_comment"
          # Without this the log only says "is_error: true" when Claude fails, never why.
          show_full_output: true
