name: Release

# Stages a new version of the inlaytrace package for Matt to approve. Versions
# come from Changesets (see .changeset/README.md): merge the PR that ran
# `npm run version-packages`, and this stages it. Runs when the package's
# package.json changes on main, or by hand from the Actions tab.
#
# Auth is npm trusted publishing: GitHub proves to npm which workflow is
# running, so no npm token is stored anywhere, and the release carries a
# provenance statement linking it to this repo and commit. The trusted
# publisher may only *stage*: nothing is public until a maintainer approves it
# with two-factor authentication (`npx npm@11.21.1 stage list inlaytrace`, then
# `npx npm@11.21.1 stage approve <id>`). After approving, run this workflow from
# the Actions tab: it finds the version on npm, publishes nothing, tags it and
# makes the GitHub release from the version's CHANGELOG section.
on:
  push:
    branches: [main]
    paths: [packages/inlay/package.json]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    # A manual run could pick any branch; only main publishes.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # pushes the version tag
      id-token: write # trusted publishing (stage only) and provenance
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      # `npm stage` and trusted publishing need a recent npm; pin a known one.
      - run: npm install -g npm@11.21.1 && npm --version
      - name: Is this version on npm yet?
        id: version
        run: |
          v=$(node -p "require('./packages/inlay/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if npm view "inlaytrace@$v" version > /dev/null 2>&1; then
            echo "::notice::inlaytrace@$v is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish == 'true'
        run: npm ci
      - if: steps.version.outputs.publish == 'true'
        run: npm test
      - if: steps.version.outputs.publish == 'true'
        name: Build and check the package
        run: |
          npm run build -w packages/inlay
          npm run check -w packages/inlay
          node packages/inlay/test/smoke.mjs
      # `npm stage` doesn't understand workspaces, so it runs in the package's folder.
      - if: steps.version.outputs.publish == 'true'
        name: Stage inlaytrace@${{ steps.version.outputs.version }}
        working-directory: packages/inlay
        run: |
          npm stage publish --access public --provenance
          echo "::notice::inlaytrace@${{ steps.version.outputs.version }} is staged. Approve it with 'npx npm@11.21.1 stage list inlaytrace' and 'npx npm@11.21.1 stage approve <id>', then re-run this workflow to tag it and make the GitHub release."
      # Every run, not only publishing ones: if a publish succeeded but its tag
      # push failed, a re-run (which publishes nothing) still makes the tag.
      - name: Tag the release
        run: |
          tag="inlaytrace@${{ steps.version.outputs.version }}"
          if ! npm view "$tag" version > /dev/null 2>&1; then exit 0; fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag is already tagged."
          else
            git tag "$tag"
            git push origin "$tag"
          fi
      # The GitHub release for that tag, its notes this version's section of
      # packages/inlay/CHANGELOG.md. Like the tag, made on any run that finds it missing.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.version }}"
          tag="inlaytrace@$v"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then exit 0; fi
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag already has a release."
          else
            node scripts/changelog.mjs --notes "$v" > notes.md
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "inlaytrace $v" --notes-file notes.md --verify-tag
          fi
