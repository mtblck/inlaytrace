name: Release

# Publishes a new version of the inlaytrace package (ADR 0006). Versions come
# from Changesets (see .changeset/README.md): merging the PR that ran
# `npm run version-packages` is the approval, and this run publishes it, tags
# it `inlaytrace@x.y.z` and makes the GitHub release from the version's
# CHANGELOG section (and any missing for older tags). Runs when the package's
# package.json changes on main, or by hand from the Actions tab to finish a
# half-done release.
#
# Auth is npm trusted publishing: GitHub proves to npm which workflow is
# running, so no npm token is stored anywhere, and the release carries a
# provenance statement linking it to this repo and commit. Keep this file's
# name: the trusted publisher on npmjs.com (inlaytrace -> Settings -> Trusted
# publishers, repository mtblck/inlaytrace, workflow release.yml) names it.
on:
  push:
    branches: [main]
    paths: [packages/inlay/package.json]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    # A manual run could pick any branch; only main publishes.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # pushes the version tag
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      # Trusted publishing needs npm 11.5.1 or newer; pin a known one.
      - run: npm install -g npm@11.21.1 && npm --version
      - name: Is this version on npm yet?
        id: version
        run: |
          v=$(node -p "require('./packages/inlay/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if npm view "inlaytrace@$v" version > /dev/null 2>&1; then
            echo "::notice::inlaytrace@$v is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.publish == 'true'
        run: npm ci
      - if: steps.version.outputs.publish == 'true'
        run: npm test
      - if: steps.version.outputs.publish == 'true'
        name: Build and check the package
        run: |
          npm run build -w packages/inlay
          npm run check -w packages/inlay
          node packages/inlay/test/smoke.mjs
      # Publishing from the package's folder publishes only the package, not the workspace root.
      - if: steps.version.outputs.publish == 'true'
        name: Publish inlaytrace@${{ steps.version.outputs.version }}
        working-directory: packages/inlay
        run: |
          npm publish --access public --provenance
          # The tag step checks npm for the version; give the registry a moment to show it.
          for i in $(seq 1 12); do
            npm view "inlaytrace@${{ steps.version.outputs.version }}" version > /dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "::warning::npm doesn't list the new version yet; re-run this workflow to tag it."
      # Every run, not only publishing ones: if a publish succeeded but its tag
      # push failed, a re-run (which publishes nothing) still makes the tag.
      - name: Tag the release
        run: |
          tag="inlaytrace@${{ steps.version.outputs.version }}"
          if ! npm view "$tag" version > /dev/null 2>&1; then exit 0; fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag is already tagged."
          else
            git tag "$tag"
            git push origin "$tag"
          fi
      # A GitHub release for each tagged version that lacks one (this run's,
      # and any older one), its notes that version's section of
      # packages/inlay/CHANGELOG.md. Like the tag, made on any run that finds it missing.
      - name: GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="${{ steps.version.outputs.version }}"
          for v in $(sed -n 's/^## \([0-9][^ ]*\)$/\1/p' packages/inlay/CHANGELOG.md | tac); do
            tag="inlaytrace@$v"
            if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then continue; fi
            if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "$tag already has a release."
              continue
            fi
            # Only this run's version may become "Latest"; older ones are backfill.
            latest=false; [ "$v" = "$current" ] && latest=true
            node scripts/changelog.mjs --notes "$v" > notes.md
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "inlaytrace $v" --notes-file notes.md --verify-tag --latest=$latest
          done
