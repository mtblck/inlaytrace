# HD mode's models: fetch BiRefNet (background removal) and Real-ESRGAN x4plus
# (upscaling), convert to ONNX, try them against remove.bg and the in-browser
# model, store the weights in Vercel Blob, and publish the report and the
# models' manifest to the hd-models-report branch. Runs here because the dev
# sandbox can't reach the model hosts. Manual, or on a push to hd-models.
name: HD models

on:
  workflow_dispatch:
    inputs:
      birefnet_assets:
        description: BiRefNet release assets to try, comma-separated
        required: false
        default: BiRefNet-general-bb_swin_v1_tiny-epoch_232.onnx,BiRefNet-general-epoch_244.onnx
  push:
    branches: [hd-models]
    paths: ['scripts/hd-models/**', '.github/workflows/hd-models.yml']

permissions:
  contents: write

jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python packages
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          pip install onnx==1.17.0 onnxruntime==1.20.1 numpy==2.1.3 pillow==11.0.0 requests==2.32.3 scikit-image==0.24.0 cairosvg==2.7.1
      - name: Fetch, convert and compare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REMOVE_BG_KEY: ${{ secrets.REMOVE_BG_KEY }}
          # The tiny general model and the full one, unless a manual run names others.
          BIREFNET_ASSETS: ${{ inputs.birefnet_assets || 'BiRefNet-general-bb_swin_v1_tiny-epoch_232.onnx,BiRefNet-general-epoch_244.onnx' }}
        run: python scripts/hd-models/prepare.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Upload the models to Vercel Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          npm install --no-save --prefix scripts/hd-models @vercel/blob@2.8.0
          node scripts/hd-models/upload.mjs
      - name: Publish the report and manifest
        run: |
          cp models/manifest.json report/
          cd report
          git init -q -b hd-models-report
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "HD models report for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" hd-models-report
