<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Soft shading for npm run score (made for this repo, MIT): a sky lightening to the horizon,
       a shaded ball, a hill darkening into the distance, and flat shapes, which must stay flat. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6fb5"/>
      <stop offset="1" stop-color="#bcd9f2"/>
    </linearGradient>
    <radialGradient id="ball" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#f6c26b"/>
      <stop offset="1" stop-color="#c0571c"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#3f8f4a"/>
      <stop offset="1" stop-color="#1d4d2a"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#sky)"/>
  <circle cx="138" cy="62" r="34" fill="url(#ball)"/>
  <path d="M0 140 C50 110 110 112 200 132 L200 200 L0 200 Z" fill="url(#hill)"/>
  <rect x="30" y="118" width="36" height="30" fill="#f3ede1"/>
  <path d="M26 120 L48 100 L70 120 Z" fill="#9b2f2f"/>
  <rect x="44" y="132" width="9" height="16" fill="#3a2a20"/>
</svg>
