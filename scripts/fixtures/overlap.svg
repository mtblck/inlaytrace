  <rect x="100" y="130" width="30" height="50" fill="#d9542b"/>
  <rect x="101.5" y="131.5" width="30" height="50" fill="#1f3b4d"/>
  <circle cx="160" cy="160" r="22" fill="#d3e5f1"/>
  <circle cx="164" cy="160" r="21" fill="#2d6a4f"/>
</svg>
